[tool.pytest.ini_options]
testpaths = [
  "services/api/tests",
  "services/worker/tests",
  "packages/contracts/python_tests",
]
addopts = "--strict-markers"
markers = ["integration: requires an external PostgreSQL test database"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
namespace_packages = true
explicit_package_bases = true
mypy_path = ["services/api/src", "services/worker/src", "packages/contracts/python"]
