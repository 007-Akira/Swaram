[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "swaram-worker"
version = "0.0.0"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.10,<3",
  "psycopg[binary]>=3.2,<4",
  "sqlalchemy>=2.0,<3",
]

[project.optional-dependencies]
dev = ["mypy>=1.15,<2", "pytest>=8.3,<9", "ruff>=0.9,<1"]

[project.scripts]
swaram-worker = "swaram_worker.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/swaram_worker"]
