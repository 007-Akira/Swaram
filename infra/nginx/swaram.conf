limit_req_zone $binary_remote_addr zone=swaram_api:10m rate=2r/s;

upstream swaram_web {
    server web:3000;
}

upstream swaram_api {
    server api:8000;
}

server {
    listen 80;
    server_name ${SWARAM_DOMAIN};
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name ${SWARAM_DOMAIN};

    ssl_certificate /etc/nginx/tls/fullchain.pem;
    ssl_certificate_key /etc/nginx/tls/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 100m;

    location /api/ {
        limit_req zone=swaram_api burst=20 nodelay;
        proxy_pass http://swaram_api;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
    }

    location /health {
        proxy_pass http://swaram_api;
    }

    location /ready {
        proxy_pass http://swaram_api;
    }

    location / {
        proxy_pass http://swaram_web;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
    }
}
