name: swaram-production

x-python-env: &python-env
  APP_ENV: production
  DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-swaram}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-swaram}
  PRIVATE_DATA_ROOT: /data

services:
  proxy:
    image: nginx:1.27-alpine
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_healthy
    environment:
      SWARAM_DOMAIN: ${SWARAM_DOMAIN:?set SWARAM_DOMAIN}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/swaram.conf:/etc/nginx/templates/default.conf.template:ro
      - ${TLS_CERTIFICATE_DIR:?set TLS_CERTIFICATE_DIR}:/etc/nginx/tls:ro
    networks: [frontend]
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /var/run
      - /tmp
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped

  web:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: https://${SWARAM_DOMAIN:?set SWARAM_DOMAIN}
    environment:
      NEXT_PUBLIC_API_URL: https://${SWARAM_DOMAIN:?set SWARAM_DOMAIN}
    networks: [frontend]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped

  api:
    build:
      context: ..
      dockerfile: services/api/Dockerfile
    environment:
      <<: *python-env
      CORS_ORIGINS: '["https://${SWARAM_DOMAIN:?set SWARAM_DOMAIN}"]'
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - private_data:/data
    networks: [frontend, backend]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped

  worker:
    build:
      context: ..
      dockerfile: services/worker/Dockerfile
    environment:
      <<: *python-env
      WORKER_TEMP_ROOT: /var/tmp/swaram
      STEM_DEVICE: cpu
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - private_data:/data
    networks: [backend]
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m
      - /var/tmp/swaram:rw,noexec,nosuid,nodev,size=2g,uid=10001,gid=10001
    cpus: 4
    mem_limit: 8g
    pids_limit: 256
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    stop_grace_period: 20m
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-swaram}
      POSTGRES_USER: ${POSTGRES_USER:-swaram}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks: [backend]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

networks:
  frontend:
  backend:
    internal: true

volumes:
  postgres_data:
  private_data:
