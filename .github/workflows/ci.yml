name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm format:check

  python-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            packages/contracts/pyproject.toml
            services/api/pyproject.toml
            services/worker/pyproject.toml
      - run: >-
          python -m pip install
          -e packages/contracts
          -e "services/api[dev]"
          -e "services/worker[dev]"
      - run: ruff check services packages/contracts
      - run: ruff format --check services packages/contracts
      - run: mypy services/api/src services/worker/src packages/contracts/python
      - run: pytest -m "not integration"

  postgres-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: swaram_test
          POSTGRES_USER: swaram_test
          POSTGRES_PASSWORD: test-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U swaram_test -d swaram_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      APP_ENV: test
      DATABASE_URL: postgresql+psycopg://swaram_test:test-only-password@localhost:5432/swaram_test
      TEST_DATABASE_URL: postgresql+psycopg://swaram_test:test-only-password@localhost:5432/swaram_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            packages/contracts/pyproject.toml
            services/api/pyproject.toml
            services/worker/pyproject.toml
      - run: >-
          python -m pip install
          -e packages/contracts
          -e "services/api[dev]"
          -e "services/worker[dev]"
      - run: alembic -c services/api/alembic.ini upgrade head
      - run: pytest -m integration services/api/tests/integration services/worker/tests/integration
      - run: swaram-worker --once
